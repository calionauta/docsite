name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/self-test.sh
